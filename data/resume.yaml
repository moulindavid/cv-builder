summaries:
  fr: Senior Backend Engineer avec plus de 8 ans d’expérience dans la conception et l’exploitation de plateformes SaaS et de systèmes transactionnels. Spécialisé en Java/Spring, PostgreSQL et systèmes distribués, avec une forte expérience de la facturation, des paiements, des traitements asynchrones, de la performance et de la production. Habitué à intervenir de la conception jusqu’à la mise en production et au suivi opérationnel.
  en: Senior Backend Engineer with 8+ years of experience designing and operating SaaS platforms and transactional systems. Specialized in Java/Spring, PostgreSQL, and distributed systems, with strong experience in billing, payments, asynchronous processing, performance, and production. Experienced in owning delivery from design through production rollout and operations.
