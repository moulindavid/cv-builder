          fr: Diagnostic et optimisation de traitements PostgreSQL critiques liés à la facturation, aux commissions et aux remboursements, par réécriture des accès aux données et ajout d’index ciblés ; évolution du schéma et gestion des migrations avec Liquibase.
          en: Diagnosed and optimized critical PostgreSQL processing for billing, commissions, and reimbursements through data-access rewrites and targeted indexes; evolved the schema and managed migrations with Liquibase.
        tags: [postgresql, liquibase, database]
      - id: production
        text:
          fr: "Responsabilité opérationnelle sur les services en production : investigation et résolution d’incidents, hotfixes et corrections ciblées de données."
          en: Owned operational support for production services, including incident investigation and resolution, hotfixes, and targeted data corrections.
        tags: [production, database]
