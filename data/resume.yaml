experience:
  - id: benefiz
    company: Benefiz
    roles: {fr: Senior Backend Engineer, en: Senior Backend Engineer}
    start: "2023"
    end: present
    descriptions:
      fr: Développement et évolution d’une plateforme B2B/B2C de distribution de produits d’assurance collective et de titres restaurant, utilisée par des centaines de milliers d’affiliés, des milliers d’entreprises et de courtiers.
      en: Development and evolution of a B2B/B2C platform distributing group insurance and meal voucher products, used by hundreds of thousands of members and thousands of companies and brokers.
    technologies: [java25, spring-boot, postgresql, rabbitmq, pubsub, docker, gcp, bigquery, dbt, metabase, stripe, liquibase, datadog]
    bullets:
      - id: backend-domains
        text:
          fr: Conception et évolution de services backend Java au sein d’une architecture microservices couvrant les contrats, la tarification, la facturation, les commissions, les paiements et les remboursements.
          en: Designed and evolved Java backend services within a microservices architecture covering contract management, pricing, billing, commissions, payments, and reimbursements.
        tags: [java, backend, microservices, payments]
      - id: async-flows
        text:
          fr: Implémentation et maintenance de flux asynchrones via RabbitMQ et Pub/Sub pour les notifications, commandes de cartes, synchronisations externes et traitements financiers.
          en: Implemented and maintained asynchronous RabbitMQ and Pub/Sub flows for notifications, card orders, external synchronization, and financial processing.
        tags: [rabbitmq, pubsub, messaging, distributed-systems]
      - id: integrations
        text:
          fr: Intégration de Stripe, Swan, Memobank, Payfit, Lucca, Malibou, Tessi et Amundi.
          en: Integrated Stripe, Swan, Memobank, Payfit, Lucca, Malibou, Tessi, and Amundi.
        tags: [integrations, payments]
      - id: database
        text:
          fr: Diagnostic et optimisation de traitements PostgreSQL critiques liés à la facturation, aux commissions et aux remboursements, par réécriture des accès aux données et ajout d’index ciblés ; évolution du schéma et gestion des migrations avec Liquibase.
          en: Diagnosed and optimized critical PostgreSQL processing for billing, commissions, and reimbursements through data-access rewrites and targeted indexes; evolved the schema and managed migrations with Liquibase.
        tags: [postgresql, liquibase, database]
      - id: production
        text:
          fr: Résolution d’un incident critique affectant une centaine de commandes de cartes, récupérées proactivement par republication Pub/Sub ; mise en place du suivi avec dbt, BigQuery et Metabase, ainsi que d’alertes Datadog, sans récidive observée depuis.
          en: Resolved a critical incident affecting approximately 100 card orders, proactively recovered through Pub/Sub republication; implemented tracking with dbt, BigQuery, and Metabase plus Datadog alerts, with no recurrence observed since.
        tags: [production, incident-response, pubsub, datadog, observability, dbt, bigquery, metabase]
      - id: architecture-business
        text:
          fr: Responsable technique principal de la brique de gestion des arrêts de travail et de leur indemnisation dans le cadre de la prévoyance collective, avec pilotage de bout en bout du besoin jusqu’à la mise en production.
          en: Served as the primary technical owner for a group insurance module handling employee sick-leave claims and benefit payments, driving delivery end to end from requirements through production rollout.
        tags: [architecture, technical-leadership, ownership, collaboration, delivery]
